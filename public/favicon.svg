<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0a3c"/>
      <stop offset="100%" stop-color="#0f0a1e"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle inner border glow -->
  <rect width="512" height="512" rx="108" fill="none"
        stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Soft glow behind star -->
  <ellipse cx="256" cy="256" rx="140" ry="140"
           fill="url(#glow)" filter="url(#blur)"/>

  <!-- 4-pointed sparkle star — main shape -->
  <!-- Outer radius 152, inner radius 28 -->
  <path d="
    M 256 104
    C 248 180 284 220 256 256
    C 220 228 176 248 104 256
    C 176 264 220 284 256 256
    C 284 292 248 332 256 408
    C 264 332 292 292 256 256
    C 336 284 376 264 408 256
    C 376 248 336 228 256 256
    C 292 220 264 180 256 104
    Z
  " fill="url(#starGrad)"/>

  <!-- Small centre dot for depth -->
  <circle cx="256" cy="256" r="14" fill="#f5f3ff" fill-opacity="0.9"/>
</svg>
