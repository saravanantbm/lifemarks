  <circle cx="364" cy="364" r="2.5" fill="#ffffff" fill-opacity="0.06"/>
  <path d="M 190 96 L 322 96 Q 340 96 340 114 L 340 420 L 256 362 L 172 420 L 172 114 Q 172 96 190 96 Z"
